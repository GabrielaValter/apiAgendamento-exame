<div class="login-page">
    <div class="login-panel">

        <div class="brand">
            <div class="brand-text">
                <h1>Agendamento</h1>
                <span>Sistema de gerenciamento</span>
            </div>
        </div>

        <mat-card class="login-card">
            <div class="title">
                <mat-card-title>Login</mat-card-title>
            </div>

            <mat-card-content>
                <form [formGroup]="form" (ngSubmit)="submit()">

                    <mat-form-field appearance="outline" class="full">
                        <mat-label>Email</mat-label>
                        <mat-icon matPrefix>mail</mat-icon>
                        <input matInput formControlName="email" type="email" />
                        <mat-error *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
                            Informe um e-mail válido
                        </mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="full">
                        <mat-label>Senha</mat-label>
                        <mat-icon matPrefix>lock</mat-icon>
                        <input matInput formControlName="senha" type="password" />
                        <mat-error *ngIf="form.get('senha')?.invalid && form.get('senha')?.touched">
                            Informe sua senha
                        </mat-error>
                    </mat-form-field>

                    <button mat-raised-button class="btn-login full" type="submit">
                        Entrar
                    </button>

                    <div class="register-link">
                        <span>Não possuí uma conta?</span>
                        <a routerLink="/register">Criar Conta</a>
                    </div>
                </form>
            </mat-card-content>
        </mat-card>

    </div>
</div>
